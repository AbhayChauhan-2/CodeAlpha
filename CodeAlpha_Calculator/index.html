<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive calculator built with HTML, CSS and JavaScript for CodeAlpha internship.">
  <title>CodeAlpha Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <header class="calculator-header">
      <span class="badge">CodeAlpha Internship</span>
      <h1>Calculator</h1>
    </header>

    <section class="display-card" aria-label="Calculator display">
      <div id="history" class="history"></div>
      <input id="display" class="display" type="text" value="0"
             aria-label="Calculator display" readonly>
    </section>

    <section class="keypad" aria-label="Calculator keypad">
      <button class="key function" data-action="clear">AC</button>
      <button class="key function" data-action="delete">DEL</button>
      <button class="key operator" data-value="%">%</button>
      <button class="key operator" data-value="/">÷</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key operator" data-value="*">×</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key operator" data-value="-">−</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key operator" data-value="+">+</button>

      <button class="key zero" data-value="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key equals" data-action="equals">=</button>
    </section>

    <p class="keyboard-hint">Keyboard supported • Enter = calculate • Esc = clear • Backspace = delete</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
